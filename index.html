<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
    <title>Nosso primeiro site</title>
</head>
<body>
  <header>
<h1>Meu blog</h1>
<p>Vou compartilhar conhecimentos com você</p>
<img src="https://www.rfi.fr/br/esportes/20180802-neymar-completa-primeiro-aniversario-no-psg-um-ano-de-altos-e-baixos" alt="imagem um">
  </header>
  <main>
    <h2>Meu primeiro post</h2>
    <p>Por: Rafael</p>
    <p>Boas vindas ao meu blog, aqui vou compartilhar dicas com você!</p>
    <button>👍<span>0</span></button>
    <button>👎<span>0</span></button>
    <button>😐<span>0</span></button>
  </main> 
</body>
<script>
  const botoes = document.querySelectorAll("button");
    botoes. forEach(function(botao){
  botao.addEventListener("click", botaoClicado);
  function botaoClicado(){
    let texto = botao.querySelector("span");
    texto.textContent++;
    }
 
  })
</script>
</html>
